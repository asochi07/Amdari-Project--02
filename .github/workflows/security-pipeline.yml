name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (fail on ERROR severity)
        run: semgrep scan --config=auto --severity=ERROR --error

  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (fail on HIGH severity + HIGH confidence)
        run: bandit -r . -ll -ii --exclude ./infra,./policy,./test

  trivy:
    name: Vuln Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  oidc-check:
    name: OIDC Trust Check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143985718659:role/sentinelpay-github-deploy
          aws-region: af-south-1
      - name: Verify assumed identity
        run: |
          echo "Successfully assumed role via OIDC:"
          aws sts get-caller-identity

  checkov:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: false
          output_format: cli

  tfsec:
    name: IaC Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec on Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/

  opa-plan:
    name: IaC Policy Gate (OPA/Conftest)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143985718659:role/sentinelpay-github-deploy
          aws-region: af-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false
      - name: Terraform plan (no refresh; infra not applied)
        working-directory: infra
        run: |
          terraform plan -input=false -refresh=false -out=tfplan.bin
          terraform show -json tfplan.bin > plan.json
      - name: Install Conftest
        run: |
          CFVER=0.56.0
          curl -sL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CFVER}/conftest_${CFVER}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
      - name: Run OPA policy pack against the plan
        run: conftest test infra/plan.json --policy policy --all-namespaces
